name: SonyLiv Playlist Auto Update

on:
  schedule:
    - cron: '0 */30 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-sonyliv:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install requests

      - name: Run SonyLiv Script
        run: python Scripts/sonyliv_playlist.py

      - name: Commit and Push SonyLiv Files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SonyLiv.m3u SonyLiv_data.json
          if ! git diff --staged --quiet; then
            git commit -m "Auto update SonyLiv playlist and JSON"
            git push
          else
            echo "No changes to SonyLiv.m3u or SonyLiv_data.json"
          fi
